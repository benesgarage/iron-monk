site_name: iron-monk
site_description: A minimalist, zero-coercion validation library for Python.
site_url: https://benesgarage.github.io/iron-monk/

theme:
  name: material
  logo: assets/monk.png
  favicon: assets/monk.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.sections
    - navigation.path
    - navigation.footer
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

repo_name: benesgarage/iron-monk
repo_url: https://github.com/benesgarage/iron-monk
edit_uri: edit/main/docs/

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Core Concepts: concepts.md
  - Constraints: constraints.md
  - Advanced:
      - advanced/index.md
      - Cross-Field Validation: advanced/cross_field.md
      - Customization: advanced/customization.md
      - Execution Models: advanced/execution.md
      - Settings & Type Metadata: advanced/settings.md
  - Integrations:
      - examples/index.md
      - Web APIs:
        - Strawberry GraphQL: examples/strawberry.md
        - Starlette (ASGI): examples/starlette.md
        - FastAPI: examples/fastapi.md
      - Data & ORMs:
        - SQLAlchemy 2.0: examples/sqlalchemy.md
        - Tortoise ORM: examples/tortoise_orm.md
      - Config & CLI:
        - App Configuration: examples/app_config.md
        - tyro (CLI tool): examples/tyro.md
      - Typing Ecosystem:
        - Beartype: examples/beartype.md
  - Reference:
      - API Reference: api_reference.md
      - Benchmarks: benchmarks.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/benesgarage/iron-monk
      name: iron-monk on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/iron-monk/
      name: iron-monk on PyPI